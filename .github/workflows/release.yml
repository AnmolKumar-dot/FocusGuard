name: Release APK

# Run this by hand: Actions tab > Release APK > Run workflow, then enter a version tag.
# It builds the APK and publishes a GitHub release with RELEASE_NOTES.md as the description.
#
# To sign with your own private key (recommended), add these four repository secrets first
# (Settings > Secrets and variables > Actions): KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD. The README explains how to make the key. Without them the APK is signed with the
# shared debug key and the run prints a warning.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v3.0.0"
        required: true
        default: "v3.0.0"
      prerelease:
        description: "Mark as a pre-release (alpha or beta)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found. Signing with the shared debug key."
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "release" ]; then
            gradle assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk app-out.apk
          else
            gradle assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk app-out.apk
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cp app-out.apk "FocusGuard-${TAG}.apk"
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" "FocusGuard-${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "FocusGuard ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            $FLAGS
